<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Odds Lay e Normal</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #242628;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            gap: 20px;
            padding: 20px;
        }
        .calculator-container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px 40px;
            width: 450px;
            max-width: 90%;
            box-sizing: border-box;
        }
        .logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo img {
            width: 150px;
        }
        h2 {
            font-size: 28px;
            font-weight: 700;
            color: #333333;
            margin-bottom: 25px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
        }
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            color: #333333;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
            -webkit-appearance: textfield;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .form-group input[type="number"]:focus {
            border-color: #ff9900;
        }
        .form-group input[type="number"]::-webkit-inner-spin-button,
        .form-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .results {
            margin-top: 30px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .result-item label {
            font-size: 17px;
            font-weight: 600;
            color: #333333;
        }
        .result-value {
            font-size: 17px;
            font-weight: 700;
            color: #28A745;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-value.loss {
            color: #dc3545;
        }
        .copy-icon {
            background-color: #f0f2f5;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .copy-icon:hover {
            background-color: #e0e2e5;
        }
        .copy-icon svg {
            width: 18px;
            height: 18px;
            fill: #555555;
        }
        /* Estilos para a calculadora normal */
        .normal-calculator {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .normal-display {
            width: 100%;
            height: 70px;
            background-color: #f0f2f5;
            border: none;
            border-radius: 10px;
            font-size: 28px;
            text-align: right;
            padding: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
            color: #333333;
        }
        .normal-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
        }
        .normal-button {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background-color: #e0e0e0;
            cursor: pointer;
            transition: background-color 0.2s ease;
            height: 60px;
            color: #333333; /* Cor padrão da fonte */
        }
        .normal-button:hover {
            background-color: #d0d0d0;
        }
        .normal-button.operator {
            background-color: #ff9900;
            color: white;
        }
        .normal-button.operator:hover {
            background-color: #e68a00;
        }
        .normal-button.equals {
            background-color: #28A745;
            color: white;
            grid-column: span 2;
        }
        .normal-button.equals:hover {
            background-color: #218838;
        }
        /* Estilo específico para C, % e Backspace */
        .normal-button.special {
            background-color: #a6a6a6;
            color: white; /* Fonte branca */
        }
        .normal-button.special:hover {
            background-color: #949494;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="logo">
            <img src="lay-calculator-icon.png" alt="">
        </div>

        <h2>Calculadora de Odds Lay</h2>

        <div class="form-group">
            <label for="oddLay">Odd Lay</label>
            <input type="number" id="oddLay" step="0.01" min="1">
        </div>

        <div class="form-group">
            <label for="responsabilidadeLay">Responsabilidade Lay</label>
            <input type="number" id="responsabilidadeLay" step="0.01" min="0">
        </div>

        <div class="form-group">
            <label for="oddBack">Odd Back</label>
            <input type="number" id="oddBack" step="0.01" min="1">
        </div>

        <div class="results">
            <div class="result-item">
                <label>Stake de Back</label>
                <div class="result-value">
                    <span id="stakeBackValue">0.00</span>
                    <div class="copy-icon" onclick="copyToClipboard('stakeBackValue')">
                        <svg viewBox="0 0 24 24">
                            <path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 4 6 4.9 6 6v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H8V6h11v14z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="result-item">
                <label>Perda/Lucro</label>
                <div class="result-value" id="profitLossContainer">
                    <span id="profitLossValue">0.00 (0.00%)</span>
                </div>
            </div>
        </div>
    </div>

    <div class="calculator-container normal-calculator">
        <!-- Título já removido anteriormente -->
        
        <input type="text" id="normalDisplay" class="normal-display" readonly>

        <div class="normal-buttons">
            <button class="normal-button special" onclick="clearDisplay()">C</button>
            <button class="normal-button special operator" onclick="appendToDisplay('%')">%</button>
            <button class="normal-button special" onclick="correctDisplay()">⌫</button>
            <button class="normal-button operator" onclick="appendToDisplay('/')">÷</button>
            <button class="normal-button" onclick="appendToDisplay('7')">7</button>
            <button class="normal-button" onclick="appendToDisplay('8')">8</button>
            <button class="normal-button" onclick="appendToDisplay('9')">9</button>
            <button class="normal-button operator" onclick="appendToDisplay('*')">×</button>
            <button class="normal-button" onclick="appendToDisplay('4')">4</button>
            <button class="normal-button" onclick="appendToDisplay('5')">5</button>
            <button class="normal-button" onclick="appendToDisplay('6')">6</button>
            <button class="normal-button operator" onclick="appendToDisplay('-')">-</button>
            <button class="normal-button" onclick="appendToDisplay('1')">1</button>
            <button class="normal-button" onclick="appendToDisplay('2')">2</button>
            <button class="normal-button" onclick="appendToDisplay('3')">3</button>
            <button class="normal-button operator" onclick="appendToDisplay('+')">+</button>
            <button class="normal-button" onclick="appendToDisplay('0')">0</button>
            <button class="normal-button" onclick="appendToDisplay('.')">.</button>
            <button class="normal-button equals" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        // Get elements
        const oddLayInput = document.getElementById('oddLay');
        const responsabilidadeLayInput = document.getElementById('responsabilidadeLay');
        const oddBackInput = document.getElementById('oddBack');
        const stakeBackValue = document.getElementById('stakeBackValue');
        const profitLossValue = document.getElementById('profitLossValue');
        const profitLossContainer = document.getElementById('profitLossContainer');
        const normalDisplay = document.getElementById('normalDisplay');

        // Function to calculate Odds Lay
        function calculateLayBack() {
            const oddLay = parseFloat(oddLayInput.value) || 0;
            const responsabilidadeLay = parseFloat(responsabilidadeLayInput.value) || 0;
            let oddBack = parseFloat(oddBackInput.value) || 0;

            // Substitui "1" por "1.000001" no campo Odd Back
            if (oddBack === 1) {
                oddBack = 1.000001;
            }
            // Substitui "1000" por "10001" no campo Odd Back
            if (oddBack === 1000) {
                oddBack = 10001;
            }

            if (oddLay <= 1 || oddBack <= 1 || responsabilidadeLay <= 0) {
                stakeBackValue.textContent = '0.00';
                profitLossValue.textContent = '0.00 (0.00%)';
                profitLossContainer.classList.remove('loss');
                return;
            }

            // Formula validated from Fulltrader behavior:
            // Stake de Back = (Responsabilidade Lay + (Responsabilidade Lay / (Odd Lay - 1))) / Odd Back
            // Perda/Lucro = (Responsabilidade Lay / (Odd Lay - 1)) - Stake de Back
            const stakeBack = (responsabilidadeLay + (responsabilidadeLay / (oddLay - 1))) / oddBack;
            const profitLoss = (responsabilidadeLay / (oddLay - 1)) - stakeBack;

            // Calculate percentage based on Responsabilidade Lay
            let percentage = 0;
            if (responsabilidadeLay !== 0) {
                percentage = (profitLoss / responsabilidadeLay * 100).toFixed(2);
            }

            // Update values
            stakeBackValue.textContent = stakeBack.toFixed(2);
            profitLossValue.textContent = `${profitLoss.toFixed(2)} (${percentage}%)`;

            // Set color based on profit/loss
            if (profitLoss < 0) {
                profitLossContainer.classList.add('loss');
            } else {
                profitLossContainer.classList.remove('loss');
            }
        }

        // Functions for normal calculator
        function appendToDisplay(value) {
            normalDisplay.value += value;
        }

        function clearDisplay() {
            normalDisplay.value = '';
        }

        function correctDisplay() {
            normalDisplay.value = normalDisplay.value.slice(0, -1);
        }

        function calculateResult() {
            try {
                let expression = normalDisplay.value;
                // Procurar por padrões como "número operador número%"
                const percentMatch = expression.match(/(\d+(?:\.\d+)?)\s*([+\-×÷])\s*(\d+(?:\.\d+)?)%$/);
                if (percentMatch) {
                    const baseNumber = parseFloat(percentMatch[1]);
                    const operator = percentMatch[2];
                    const percentValue = parseFloat(percentMatch[3]) / 100;
                    let result;
                    switch (operator) {
                        case '+':
                            result = baseNumber + (baseNumber * percentValue);
                            break;
                        case '-':
                            result = baseNumber - (baseNumber * percentValue);
                            break;
                        case '×':
                            result = baseNumber * percentValue;
                            break;
                        case '÷':
                            if (percentValue === 0) throw new Error("Divisão por zero");
                            result = baseNumber / percentValue;
                            break;
                    }
                    normalDisplay.value = result || 0;
                    return;
                }
                // Caso não haja %, avaliar normalmente
                expression = expression.replace(/×/g, '*').replace(/÷/g, '/');
                normalDisplay.value = eval(expression) || 0;
            } catch (e) {
                normalDisplay.value = 'Erro';
                setTimeout(clearDisplay, 1000); // Limpa após 1 segundo se houver erro
            }
        }

        // Add event listeners
        oddLayInput.addEventListener('input', calculateLayBack);
        responsabilidadeLayInput.addEventListener('input', calculateLayBack);
        oddBackInput.addEventListener('input', calculateLayBack);

        // Initial calculation
        calculateLayBack();

        // Updated copy to clipboard function
        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const textToCopy = element.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                element.style.backgroundColor = '#d4edda';
                setTimeout(() => {
                    element.style.backgroundColor = '';
                }, 1000);
            }).catch(err => {
                console.error('Falha ao copiar: ', err);
            });
        }
    </script>
</body>
</html>
