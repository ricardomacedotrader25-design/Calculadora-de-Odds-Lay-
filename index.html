<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Trading - Hedge Ajustado Final</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Variáveis de Cor */
        :root {
            --bg-body: #0e151d;
            --bg-panel: #1e242b;
            --bg-header: #24303c;
            --text-white: #ffffff;
            --blue-back-solid: #8FD3FC;
            --pink-lay-solid: #FECDD8;
            --black-font: #000000; 
            --yellow-cashout: #ffc800;
            
            /* ALTERADO: Valor R$ principal (tabela e rodapé R$) agora é #1e7b16 */
            --green-positive: #1e7b16; 
            
            /* Valor R$ para o Cashout do Topo (Mantido: #1e7b16) */
            --green-positive-top: #1e7b16; 
            
            --red-negative: #ff2d2d;
            --neutral-text: #ddd;
            --border-color: #2c3b47;
            --input-bg-default: #2d3844; 
            --input-stake-text: var(--text-white);
            --button-color: #3b4d63;
            --button-hover: #4d6077;
            
            /* Porcentagem positiva do rodapé (Mantido: #1e7b16) */
            --green-darker-footer: #1e7b16; 
            --red-lighter-footer: #ff6666; 
            --gray-footer-label: #848484; 
        }

        * { box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; outline: none; }

        body {
            background-color: var(--bg-body);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        .top-settings-wrapper { width: 850px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
        
        .controls-area { display: flex; align-items: center; }

        .clear-button {
            background-color: var(--button-color);
            color: var(--text-white);
            border: none;
            padding: 8px 12px;
            margin-right: 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .clear-button:hover {
            background-color: var(--button-hover);
        }
        
        .summary-wrapper { display: flex; align-items: flex-end; }
        .risk-area { text-align: right; margin-right: 20px; font-size: 14px; color: #fff; padding-bottom: 5px; }
        .risk-label { display: block; color: var(--neutral-text); margin-bottom: 2px; font-size: 12px; }
        
        /* Estilo do Painel Cashout (Caixa Amarela do Topo) */
        .cashout-box { 
            background-color: var(--yellow-cashout); 
            color: #000; 
            padding: 8px 15px; 
            border-radius: 4px; 
            text-align: center; 
            min-width: 160px; 
            border: 1px solid #e0b000; 
        }
        
        .cashout-title { 
            font-size: 16px; 
            font-weight: bold; 
            display: block; 
            color: var(--black-font); 
        }
        
        .cashout-profit { 
            font-size: 18px; 
            font-weight: bold; 
            display: block; 
        }

        /* Cores do Valor (Topo e Tabela) */
        /* O valor positivo na tabela e no rodapé agora usa #1e7b16 (definido em --green-positive) */
        .value-pos { color: var(--green-positive); font-weight: bold; } 
        .value-neg { color: var(--red-negative); font-weight: bold; } 

        /* SOBRESCRITA: Mantida, mas usando o mesmo valor de --green-positive, apenas por segurança de escopo. */
        #total-pl-display.value-pos {
            color: var(--green-positive-top);
        }
        
        .settings-area { margin-left: 15px; font-size: 18px; color: #889; cursor: pointer; padding-bottom: 5px; }

        /* --- TABELA E HEADERS --- */
        .main-content { display: flex; gap: 20px; width: 850px; } 
        .market-container { width: 850px; } 
        .market-header { 
            background: #121a23; 
            padding: 10px; 
            border: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            color: #fff; 
            font-weight: bold; 
            /* ADIÇÃO: Permite quebra de linha e espaço */
            flex-wrap: wrap; 
            gap: 10px; 
        }
        
        /* --- ESTILOS para o Confronto --- */
        .confronto-area {
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: normal;
            color: var(--neutral-text);
        }

        .confronto-label {
            margin-right: 5px;
            font-weight: bold;
            color: var(--text-white);
        }

        .team-input {
            background: var(--input-bg-default);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 5px 8px;
            border-radius: 3px;
            width: 120px;
            font-size: 13px;
            height: 30px;
        }
        .team-input::placeholder {
            color: #807F7F;
        }
        
        /* Estilo para o input longo */
        .large-input {
            width: 350px; 
            min-width: 300px;
        }
        
        /* Estilos para o Botão de Confirmação */
        .confirm-button {
            background-color: var(--green-positive); 
            color: var(--text-white);
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-left: 10px;
            height: 30px; 
        }
        .confirm-button:hover:not(:disabled) {
            background-color: #2e8b23; 
        }
        .confirm-button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        
        /* Classe para tornar o texto do confronto maior após confirmação */
        .large-input.match-confirmed {
            font-size: 16px; 
            font-weight: bold;
            color: var(--black-font) !important; 
            background-color: var(--text-white) !important; 
            border: 2px solid var(--yellow-cashout); 
            -webkit-text-fill-color: var(--black-font); 
        }

        /* AJUSTE: Garante que o input desabilitado ainda use a cor da fonte correta e não fique opaco */
        .large-input:disabled {
            opacity: 1; 
        }
        /* --- Fim do Ajuste do Confronto --- */

        .market-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; }
        
        .market-table th { 
            padding: 8px 6px; 
            font-size: 12px; 
            text-align: center; 
            background: #1a232e;
            border-bottom: 1px solid var(--border-color); 
            height: 40px; 
            vertical-align: middle; 
            color: var(--text-white);
        }
        .market-table td { border-bottom: 1px solid var(--border-color); height: 50px; vertical-align: middle; padding: 2px; text-align: center;}
        
        /* Estilo para o campo de placar editável */
        .score-cell { 
            font-weight: bold; 
            padding-left: 5px; 
            text-align: center;
        }
        .score-input {
            width: 90%; 
            height: 35px;
            font-weight: bold;
            text-align: center;
            background: var(--input-bg-default);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 2px 5px;
            border-radius: 4px;
        }
        /* Fim da ADIÇÃO */
        
        .header-lay-font { color: var(--pink-lay-solid); font-weight: bold; }
        .header-back-font { color: var(--blue-back-solid); font-weight: bold; }

        /* --- INPUTS --- */
        .input-box {
            width: 90%; height: 40px; margin: 0 auto; text-align: center; padding: 5px; 
            border-radius: 4px; border: 1px solid #444; font-weight: bold;
            transition: border-color 0.2s; -moz-appearance: textfield; 
        }
        .input-box::-webkit-outer-spin-button,
        .input-box::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .stake.input-box { 
            background: var(--input-bg-default); 
            color: var(--input-stake-text); 
        }
        .stake.input-box:focus { border-color: var(--yellow-cashout); background: #414f5f; }
        
        /* ESTILO PARA O CIFRÃO (R$) */
        .stake.input-box::placeholder {
            color: #807F7F; 
            font-weight: bold;
        }

        .odd-input-lay, .odd-input-back { color: var(--black-font); border: 1px solid transparent; }
        .odd-input-lay { background-color: var(--pink-lay-solid); }
        .odd-input-back { background-color: var(--blue-back-solid); }

        .odd-input-lay:focus, .odd-input-back:focus {
            border-color: var(--yellow-cashout); box-shadow: 0 0 5px rgba(255, 200, 0, 0.5); 
        }

        /* --- Resultados P/L e Efeitos --- */
        .value-cell { font-weight: bold; font-size: 14px; }
        /* O trend-up agora usa --green-positive (#1e7b16) */
        .trend-up::after { content: " ▲"; color: var(--green-positive); font-weight: 700; }
        .trend-down::after { content: " ▼"; color: var(--red-negative); font-weight: 700; }
        .flash-change { animation: flash 0.6s ease; }
        @keyframes flash { 0% { background: rgba(255, 255, 0, 0.6); } 100% { background: transparent; } }

        /* --- Rodapé --- */
        .total-box { 
            margin-top: 25px; 
            padding: 15px; 
            background: #121a23; 
            border-radius: 6px; 
            font-size: 18px; 
            font-weight: bold; 
            text-align: center; 
        }
        /* Estilo para o texto do label "Cashout:" no rodapé */
        .total-box .label-text {
            color: var(--gray-footer-label); 
            margin-right: 5px;
        }

        /* Cor da caixa positiva do Rodapé (valor R$ - usa a nova --green-positive: #1e7b16) */
        .total-box-pos { color: var(--green-positive); }
        .total-box-neg { color: var(--red-negative); }
        
        /* Estilo para a porcentagem no rodapé (Mantido: #1e7b16) */
        .total-box .pct-value {
            font-size: 0.8em; 
            margin-left: 5px;
        }
        .total-box .pct-value.pos-footer {
            color: var(--green-darker-footer); 
        }
        .total-box .pct-value.neg-footer {
            color: var(--red-lighter-footer); 
        }

        /* ADIÇÃO: Estilo para a nota de recomendação no rodapé (Cor Cinza Escuro) */
        .footer-note {
            display: block;
            font-size: 11px;
            font-weight: normal;
            color: #888; /* Cinza Escuro */
            margin-top: 8px;
            border-top: 1px solid #2c3b47; 
            padding-top: 5px;
        }

    </style>
</head>
<body>
    
    <div class="top-settings-wrapper">
        <div class="controls-area">
            <button class="clear-button" onclick="clearData()"><i class="fas fa-eraser"></i> Limpar Dados</button>
            <div class="risk-area">
                <span class="risk-label">Responsabilidade Total:</span>
                <div id="total-stake-display" style="color:var(--neutral-text); font-weight:bold;">R$0,00</div>
            </div>
        </div>
        
        <div class="summary-wrapper">
            <div class="cashout-box" id="total-box-pl">
                <span class="cashout-title">Cashout</span>
                <span class="cashout-profit"><span id="total-pl-display" class="profit-value value-pos">R$0,00</span></span>
            </div>

            <div class="settings-area">
                <i class="fas fa-calculator"></i>
                <i class="fas fa-cog"></i>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="market-container">
            <div class="market-header">
                
                <div class="confronto-area">
                    <span class="confronto-label">Confronto:</span>
                    <input type="text" id="match-name" class="team-input large-input" placeholder="Preencha com os nomes das equipes (Ex: Flamengo vs Vasco)" maxlength="100">
                    <button class="confirm-button" id="confirm-match-btn" disabled><i class="fas fa-check"></i> OK</button>
                </div>

                <span><i class="fas fa-chart-line" style="color:var(--yellow-cashout)"></i> Calculadora de Cashout (Lay CS)</span>
            </div>
            
            <table class="market-table">
                <thead>
                    <tr>
                        <th style="width:10%;">Placar</th>
                        
                        <th class="header-back-font" style="width:15%;">Odd Back (Atual)</th>
                        
                        <th class="header-lay-font" style="width:15%;">Odd Lay (Entrada)</th>
                        
                        <th style="width:15%;">Stake. (R$)</th>
                        
                        <th style="width:15%;">Atual (R$)</th>
                        <th style="width:15%;">P/L (R$)</th>
                        <th style="width:15%;">P/L (%)</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>

            <div id="total" class="total-box"></div>
        </div>
    </div>

    <script>
        // --- DADOS E VARIÁVEIS ---
        // Agora os placares são os valores iniciais, que podem ser alterados pelo input
        const data = ["0-1", "0-2", "1-0", "2-0"]; 
        const tbody = document.getElementById("rows");
        const totalPLDisplay = document.getElementById('total-pl-display');
        const totalStakeDisplay = document.getElementById('total-stake-display');
        const totalBottomBox = document.getElementById('total');
        
        // Elementos do Confronto
        const matchNameInput = document.getElementById('match-name');
        const confirmButton = document.getElementById('confirm-match-btn');
        
        // Event Listeners para o Confronto
        if (matchNameInput && confirmButton) {
            matchNameInput.addEventListener('input', toggleConfirmButton);
            confirmButton.addEventListener('click', confirmMatchName);
        }
        
        // Funções de Confirmação do Confronto
        function toggleConfirmButton() {
            confirmButton.disabled = matchNameInput.value.trim() === '';
            matchNameInput.classList.remove('match-confirmed');
            matchNameInput.disabled = false;
            confirmButton.innerHTML = '<i class="fas fa-check"></i> OK';
        }
        
        function confirmMatchName() {
            if (matchNameInput.value.trim() !== '') {
                // Adiciona a classe para o estilo visual da imagem (Fundo Branco, Texto Preto, Borda Amarela)
                matchNameInput.classList.add('match-confirmed'); 
                // Bloqueia a edição
                matchNameInput.disabled = true; 
                confirmButton.disabled = true; 
                confirmButton.innerHTML = '<i class="fas fa-lock"></i>'; 
            }
        }
        
        // --- FUNÇÃO DE CÁLCULO (Hedge Lay -> Back) ---
        function calc(lay, back, responsibility) {
            lay = parseFloat(lay || 0);
            back = parseFloat(back || 0);
            responsibility = parseFloat(responsibility || 0);
            
            if (lay <= 1 || back <= 1 || responsibility <= 0) return { pl: 0, pct: 0, current: 0 };

            let calculatedBack = back;
            if (back === 1000) {
                calculatedBack = 1000000; 
            }
            
            const stake_lay = responsibility / (lay - 1);
            const pl_bruto = stake_lay * ((calculatedBack - lay) / calculatedBack);
            const pl_liquido = pl_bruto;

            const pct = (pl_liquido / responsibility) * 100;
            const current = responsibility + pl_liquido;
            
            return { pl: pl_liquido, pct, current };
        }

        // --- RENDERIZAÇÃO DA TABELA ---
        function render() {
            tbody.innerHTML = "";
            
            data.forEach(score => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                <td class="score-cell">
                    <input type="text" class="score-input" value="${score}">
                </td>
                
                <td><input type="number" step="0.01" class="back input-box odd-input-back" value="" placeholder="0.00" data-score="${score}"></td>
                
                <td><input type="number" step="0.01" class="lay input-box odd-input-lay" value="" placeholder="0.00" data-score="${score}"></td>
                
                <td><input type="number" step="0.01" class="stake input-box" value="" placeholder="R$0.00" data-score="${score}"></td>
                
                <td class="current value-cell">R$0,00</td>
                <td class="pl value-cell">R$0,00</td>
                <td class="pct value-cell">0.00%</td>
                `;

                tbody.appendChild(tr);

                tr.querySelectorAll("input").forEach(inp => {
                    inp.addEventListener("input", (e) => {
                        updateRow(tr);
                        updateTotal();
                    });
                    if (inp.classList.contains('lay') || inp.classList.contains('back')) {
                        inp.placeholder = '0.00';
                    }
                });
            });
            updateTotal(); 
        }
        
        // --- FUNÇÃO LIMPAR DADOS ---
        function clearData() {
            document.querySelectorAll('tbody input').forEach(input => {
                if (!input.classList.contains('score-input')) {
                    input.value = ''; 
                }
            });
            document.querySelectorAll('tbody tr').forEach(tr => {
                updateRow(tr); 
            });
            updateTotal(); 
            
            // Limpar e resetar campo do confronto
            matchNameInput.value = '';
            matchNameInput.classList.remove('match-confirmed');
            matchNameInput.disabled = false;
            confirmButton.disabled = true;
            confirmButton.innerHTML = '<i class="fas fa-check"></i> OK';
        }
        window.clearData = clearData;


        // --- ATUALIZA LINHA INDIVIDUALMENTE ---
        function updateRow(tr) {
            const lay = tr.querySelector('.lay').value;
            const back = tr.querySelector('.back').value;
            const responsibility = tr.querySelector('.stake').value;
            
            const { pl, pct, current } = calc(lay, back, responsibility);

            const currentCell = tr.querySelector('.current');
            const plCell = tr.querySelector('.pl');
            const pctCell = tr.querySelector('.pct');
            
            animateChange(currentCell, `R$${current.toFixed(2)}`);
            animateChange(plCell, `R$${pl.toFixed(2)}`);
            animateChange(pctCell, `${pct.toFixed(2)}%`);

            plCell.classList.toggle('value-neg', pl < 0);
            plCell.classList.toggle('value-pos', pl >= 0);
            
            const numericResponsibility = parseFloat(responsibility || 0);
            currentCell.classList.toggle('value-neg', current < numericResponsibility); 
            currentCell.classList.toggle('value-pos', current >= numericResponsibility);

            pctCell.classList.remove('trend-up', 'trend-down');
            if (pl > 0) pctCell.classList.add('trend-up');
            if (pl < 0) pctCell.classList.add('trend-down');
        }

        // --- ATUALIZA TOTAIS ---
        function updateTotal() {
            let totalPL = 0;
            let maxResponsibility = 0; 

            document.querySelectorAll('tbody tr').forEach(tr => {
                const responsibility = parseFloat(tr.querySelector('.stake').value || 0);
                const plText = tr.querySelector('.pl').textContent.replace('R$', '').trim();
                const pl = parseFloat(plText) || 0;
                
                totalPL += pl;
                
                maxResponsibility = Math.max(maxResponsibility, responsibility); 
            });

            const riskForPercentage = maxResponsibility; 
            const pctTotal = riskForPercentage > 0 ? (totalPL / riskForPercentage) * 100 : 0;
            const pctTotalText = `(${pctTotal.toFixed(2)}%)`;
            const cashoutValueHtml = `R$${totalPL.toFixed(2)}`;

            totalPLDisplay.textContent = cashoutValueHtml;
            
            totalStakeDisplay.textContent = `R$${maxResponsibility.toFixed(2)}`; 
            
            totalPLDisplay.classList.toggle('value-neg', totalPL < 0);
            totalPLDisplay.classList.toggle('value-pos', totalPL >= 0);

            let pctClass = totalPL >= 0 ? 'pos-footer' : 'neg-footer';

            // ATUALIZADO: Nota de rodapé com novo formato e cor.
            const footerNote = `<span class="footer-note">*Recomendável buscar pelo menos um lucro de 0.5% em qualquer um dos placares.</span>`;

            totalBottomBox.innerHTML = 
                `<span class="label-text">Cashout:</span> <span class="${totalPL >= 0 ? 'total-box-pos' : 'total-box-neg'}">R$${totalPL.toFixed(2)}</span> <span class="pct-value ${pctClass}">${pctTotalText}</span>`
                + footerNote; 
                
            totalBottomBox.classList.remove('total-box-neg', 'total-box-pos'); 
        }

        // --- EFEITOS VISUAIS ---
        function animateChange(element, newValue) {
            const oldValue = element.textContent;
            element.textContent = newValue;
            
            if (oldValue !== newValue) {
                element.classList.add('flash-change');
                setTimeout(() => element.classList.remove('flash-change'), 600);
            }
        }

        // --- INICIALIZAÇÃO ---
        render();

    </script>
</body>
</html>
